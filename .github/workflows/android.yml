name: Construire KIZ OS APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'images/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build-android:
    name: Construire KIZ OS
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Vérifier les fichiers
        run: |
          test -f index.html
          test -f images/icon.png
          test -f images/splash.png
          echo "Les fichiers HTML, icône et splash sont présents."

      - name: Préparer les fichiers Web
        run: |
          mkdir -p www/images
          cp index.html www/index.html
          cp -r images/. www/images/

      - name: Installer Capacitor et les ressources Android
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7 @capacitor/cli@7 @capacitor/assets@3 @capacitor/splash-screen@7

      - name: Configurer KIZ OS
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "cd.kizstudio.kizos",
            "appName": "KIZ OS",
            "webDir": "www",
            "bundledWebRuntime": false,
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 2500,
                "launchAutoHide": true,
                "backgroundColor": "#101820",
                "showSpinner": false,
                "androidScaleType": "CENTER_CROP",
                "splashFullScreen": true,
                "splashImmersive": true
              }
            }
          }
          EOF

      - name: Préparer les images de l'application
        run: |
          mkdir -p assets
          cp images/icon.png assets/icon.png
          cp images/splash.png assets/splash.png

      - name: Ajouter Android
        run: npx cap add android

      - name: Générer les icônes et le splash Android
        run: npx capacitor-assets generate --android

      - name: Synchroniser les fichiers
        run: npx cap sync android

      - name: Vérifier les ressources Android
        run: |
          echo "Vérification des ressources générées..."
          find android/app/src/main/res -maxdepth 2 \
            \( -iname '*launcher*' -o -iname '*splash*' \) -print

      - name: Construire l'APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: KIZ-OS-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
